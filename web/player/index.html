<title>去看海吧</title>
<meta name="theme-color" content="#0c0b0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@400;500&family=ZCOOL+XiaoWei&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0c0b0e;
    --ink: #efe8de;
    --muted: #a39a90;
    --accent: #9cc3dc;
    --track: rgba(239, 232, 222, 0.22);
    --glass: rgba(12, 11, 14, 0.55);
    --f-display: "ZCOOL XiaoWei", "Songti SC", "Noto Serif SC", serif;
    --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
  #stage { position: absolute; inset: 0; margin: auto; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); max-width: 100%; background: #000; touch-action: manipulation; }
  #film { display: block; width: 100%; height: 100%; cursor: pointer; }
  body.playing:not(.ui) #film { cursor: none; }
  .ctrl { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 8px; padding: 36px 18px 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(0,0,0,0.62), rgba(0,0,0,0)); transition: opacity 0.35s; }
  body.playing:not(.ui) .ctrl { opacity: 0; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; }
  button { font: 500 15px/1 var(--f-body); color: var(--ink); background: none; border: 0; min-width: 40px; height: 40px; border-radius: 6px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.1); }
  button:focus-visible, #bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .time { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #bar { position: relative; height: 18px; cursor: pointer; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--track); }
  #fill { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--accent); width: 0; pointer-events: none; }
  .chap { position: absolute; top: 4px; width: 3px; height: 10px; min-width: 0; padding: 0; border-radius: 1px; background: rgba(239,232,222,0.55); transform: translateX(-1px); }
  .chap:hover { background: var(--ink); }
  #tip { position: absolute; bottom: 20px; transform: translateX(-50%); font-size: 12px; white-space: nowrap; background: var(--glass); padding: 4px 8px; border-radius: 4px; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
  #bar:hover #tip { opacity: 1; }
  .ttl { font-family: var(--f-display); font-size: 17px; color: var(--muted); }
  #poster, #replay, #loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; background: rgba(8, 7, 10, 0.35); }
  #poster h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 7vw, 72px); color: #fff8ee; text-shadow: 0 2px 18px rgba(0,0,0,0.35); }
  #poster p { margin: 0; font-style: italic; font-family: Georgia, "Times New Roman", serif; font-size: clamp(14px, 2vw, 20px); color: #f3e7da; }
  #bigplay, #replay button { width: 84px; height: 84px; border-radius: 50%; font-size: 28px; background: rgba(255, 250, 240, 0.9); color: #2a2430; padding-left: 6px; }
  #bigplay:hover, #replay button:hover { background: #fff; }
  #poster small { color: #efe3d6; font-size: 13px; opacity: 0.85; }
  #loading { background: var(--ground); color: var(--muted); font-size: 14px; }
  @media (max-width: 560px) {
    .ttl { display: none; }
    .ctrl { padding: 24px 10px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .ctrl { transition: none; } }
</style>

<div id="stage">
  <canvas id="film" aria-label="影片画面：去看海吧"></canvas>
  <div id="poster" hidden>
    <h1>去看海吧</h1>
    <p>There is a bigger world</p>
    <button id="bigplay" type="button" aria-label="播放影片">▶</button>
    <small>约 8 分钟 · 有声音 · 画面由程序逐帧实时绘制</small>
  </div>
  <div id="replay" hidden><button type="button" aria-label="重新播放">↺</button></div>
  <div class="ctrl">
    <div id="bar" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="600" aria-valuenow="0"><div id="fill"></div><div id="tip"></div></div>
    <div class="row">
      <button id="play" type="button" aria-label="播放">▶</button>
      <span class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
      <span class="grow"></span>
      <span class="ttl">去看海吧 · There is a bigger world</span>
      <button id="mute" type="button" aria-label="静音">🔊</button>
      <button id="fs" type="button" aria-label="全屏">⛶</button>
    </div>
  </div>
  <div id="loading">正在准备影片…</div>
</div>
<audio id="snd" preload="auto">
  <source src="soundtrack.m4a" type="audio/mp4">
  <source src="soundtrack.ogg" type="audio/ogg">
</audio>
<script type="module" src="bundle.js"></script>
